name: GNAB iOS core tests
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: macos-26
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Test platform-independent streaming and audio logic
        run: swift test --package-path ios/Core
