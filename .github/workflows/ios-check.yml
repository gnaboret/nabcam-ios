name: NABCAM iOS checks (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test destination handling
        working-directory: ios/Core
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for simulator
        working-directory: ios
        run: >-
          xcodebuild -project NabcamIOS.xcodeproj -scheme NabcamIOS
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator -configuration Debug
          CODE_SIGNING_ALLOWED=NO build
      - name: Compile for iPhone
        working-directory: ios
        run: >-
          xcodebuild -project NabcamIOS.xcodeproj -scheme NabcamIOS
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device -configuration Release
          CODE_SIGNING_ALLOWED=NO build
      - uses: actions/upload-artifact@v4
        with:
          name: nabcam-ios-simulator-not-for-iphone-install
          path: ios/build/simulator/Build/Products/Debug-iphonesimulator/NabcamIOS.app
