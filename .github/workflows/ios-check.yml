name: NABCAM iOS checks (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test destinations, chat and connection profiles
        working-directory: ios/Core
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for simulator
        working-directory: ios
        run: >-
          xcodebuild -project NabcamIOS.xcodeproj -scheme NabcamIOS
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/simulator -configuration Debug
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Exercise Keychain on iOS simulator
        working-directory: ios
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test -project NabcamIOS.xcodeproj -scheme NabcamStorageTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/storage-tests -resultBundlePath build/storage-results.xcresult \
            -parallel-testing-enabled NO ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Compile for iPhone
        working-directory: ios
        run: >-
          xcodebuild -project NabcamIOS.xcodeproj -scheme NabcamIOS
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/device -configuration Release
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Verify packaged identity and permissions
        working-directory: ios
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          for target, config in [('simulator', 'Debug-iphonesimulator'), ('device', 'Release-iphoneos')]:
              app = pathlib.Path('build') / target / 'Build/Products' / config / 'NabcamIOS.app'
              with (app / 'Info.plist').open('rb') as f:
                  info = plistlib.load(f)
              assert info['CFBundleIdentifier'] == 'com.gnabcamirl.app'
              assert info['CFBundleDisplayName'] == 'GNAB CAM IRL'
              assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName'] == 'AppIcon'
              assert (app / 'Assets.car').is_file()
              for permission in ['NSCameraUsageDescription', 'NSMicrophoneUsageDescription']:
                  assert info[permission].startswith('GNAB CAM IRL')
              with (app / 'PrivacyInfo.xcprivacy').open('rb') as f:
                  privacy = plistlib.load(f)
              assert privacy['NSPrivacyTracking'] is False
              print(target, 'identity, capture permission text and app privacy manifest verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nabcam-ios-simulator-not-for-iphone-install
          path: ios/build/simulator/Build/Products/Debug-iphonesimulator/NabcamIOS.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keychain-simulator-test-results
          path: ios/build/storage-results.xcresult
          if-no-files-found: ignore
