name: NABCAM iOS checks (unsigned)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Test local signing preflight with synthetic profiles only
        run: |
          python3 -m unittest discover -s ios/scripts -p 'test_*.py' -v
          bash -n ios/scripts/archive-local.sh
      - name: Test destinations, chat and connection profiles
        working-directory: ios/Core
        run: swift test
      - name: Install project generator
        run: brew install xcodegen
      - name: Generate project
        working-directory: ios
        run: xcodegen generate
      - name: Compile for simulator
        working-directory: ios
        run: >-
          xcodebuild -project NabcamIOS.xcodeproj -scheme NabcamIOS
          -sdk iphonesimulator -destination 'generic/platform=iOS Simulator'
          -derivedDataPath build/validation -configuration Debug
          ARCHS=arm64 ONLY_ACTIVE_ARCH=YES CODE_SIGNING_ALLOWED=NO build
      - name: Exercise Keychain, overlays and audio on iOS simulator
        working-directory: ios
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test -project NabcamIOS.xcodeproj -scheme NabcamStorageTests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/validation -resultBundlePath build/storage-results.xcresult \
            -parallel-testing-enabled NO ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Compile for iPhone
        working-directory: ios
        run: >-
          xcodebuild -project NabcamIOS.xcodeproj -scheme NabcamIOS
          -sdk iphoneos -destination 'generic/platform=iOS'
          -derivedDataPath build/validation -configuration Release
          ARCHS=arm64 CODE_SIGNING_ALLOWED=NO build
      - name: Decode the synthetic receiver audio and video
        working-directory: ios
        run: |
          if ! command -v ffprobe >/dev/null; then brew install ffmpeg; fi
          xcrun xcresulttool export attachments --path build/storage-results.xcresult --output-path build/receiver-attachments
          python3 - <<'PY'
          import json, pathlib, shutil
          root = pathlib.Path('build/receiver-attachments')
          manifest = json.loads((root / 'manifest.json').read_text())
          matches = [a for test in manifest for a in test.get('attachments', [])
                     if a.get('suggestedHumanReadableName', '').startswith('srtla-av-format-change.ts')]
          assert len(matches) == 1, 'Expected exactly one synthetic receiver recording'
          source = (root / matches[0]['exportedFileName']).resolve(strict=True)
          assert source.parent == root.resolve() and 0 < source.stat().st_size <= 2 * 1024 * 1024
          shutil.copyfile(source, 'build/srtla-av-format-change.ts')
          PY
          python3 scripts/verify_av_fixture.py build/srtla-av-format-change.ts
      - name: Exercise Settings UI and capture screenshots
        working-directory: ios
        run: |
          SIMULATOR_ID=$(xcrun simctl list devices available --json | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for runtime,devices in d["devices"].items() if "iOS" in runtime for x in devices if x["name"].startswith("iPhone")))')
          xcodebuild test -project NabcamIOS.xcodeproj -scheme NabcamUITests \
            -destination "platform=iOS Simulator,id=$SIMULATOR_ID" \
            -derivedDataPath build/validation -resultBundlePath build/ui-results.xcresult \
            -parallel-testing-enabled NO ARCHS=arm64 CODE_SIGNING_ALLOWED=YES CODE_SIGN_IDENTITY=-
      - name: Export UI screenshots
        if: always()
        working-directory: ios
        run: |
          if [ -d build/ui-results.xcresult ]; then
            xcrun xcresulttool export attachments --path build/ui-results.xcresult --output-path build/ui-screenshots
          fi
      - name: Verify packaged identity and permissions
        working-directory: ios
        run: |
          python3 - <<'PY'
          import pathlib, plistlib
          for target, config in [('simulator', 'Debug-iphonesimulator'), ('device', 'Release-iphoneos')]:
              app = pathlib.Path('build/validation/Build/Products') / config / 'NabcamIOS.app'
              with (app / 'Info.plist').open('rb') as f:
                  info = plistlib.load(f)
              assert info['CFBundleIdentifier'] == 'com.gnabcamirl.app'
              assert info['CFBundleDisplayName'] == 'GNAB CAM IRL'
              assert info['CFBundleIcons']['CFBundlePrimaryIcon']['CFBundleIconName'] == 'AppIcon'
              assert (app / 'Assets.car').is_file()
              notices = (app / 'ThirdPartyNotices.txt').read_text(encoding='utf-8')
              for component in ['HaishinKit 2.2.5', 'Logboard 2.6.0', 'SRT 1.5.4', 'OpenSSL 3.3.2',
                                'Mozilla Public License Version 2.0', 'University of Illinois', 'Aladdin Enterprises']:
                  assert component in notices, f'Missing third-party notice: {component}'
              assert len(notices) > 30000
              for permission in ['NSCameraUsageDescription', 'NSMicrophoneUsageDescription']:
                  assert info[permission].startswith('GNAB CAM IRL')
              with (app / 'PrivacyInfo.xcprivacy').open('rb') as f:
                  privacy = plistlib.load(f)
              assert privacy['NSPrivacyTracking'] is False
              reasons = {item['NSPrivacyAccessedAPIType']: item['NSPrivacyAccessedAPITypeReasons']
                         for item in privacy['NSPrivacyAccessedAPITypes']}
              assert '35F9.1' in reasons['NSPrivacyAccessedAPICategorySystemBootTime']
              assert 'CA92.1' in reasons['NSPrivacyAccessedAPICategoryUserDefaults']
              print(target, 'identity, capture permission text and app privacy manifest verified')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: nabcam-ios-simulator-not-for-iphone-install
          path: ios/build/validation/Build/Products/Debug-iphonesimulator/NabcamIOS.app
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: keychain-simulator-test-results
          path: ios/build/storage-results.xcresult
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: synthetic-srtla-receiver-fixture
          path: ios/build/srtla-av-format-change.ts
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-ui-screenshots-and-results
          path: |
            ios/build/ui-screenshots
            ios/build/ui-results.xcresult
          if-no-files-found: ignore
