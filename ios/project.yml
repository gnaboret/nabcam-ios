name: NabcamIOS
options:
  preGenCommand: bash scripts/prepare-icon.sh
  deploymentTarget:
    iOS: "16.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
packages:
  NabcamCore:
    path: Core
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift.git
    exactVersion: 2.2.5
targets:
  NabcamIOS:
    type: application
    platform: iOS
    sources:
      - path: NabcamIOS
    info:
      path: build/Info.plist
      properties:
        CFBundleDisplayName: GNAB CAM IRL
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSCameraUsageDescription: GNAB CAM IRL uses your camera for the preview and live broadcasts you start.
        NSMicrophoneUsageDescription: GNAB CAM IRL uses your microphone for live broadcasts you start.
        NSLocalNetworkUsageDescription: Connect to a streaming receiver on your local network when you choose its address.
        UILaunchScreen: {}
        UIRequiresFullScreen: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationLandscapeRight
    dependencies:
      - package: NabcamCore
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
      - package: HaishinKit
        product: SRTHaishinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnabcamirl.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: 0.1.0
        CURRENT_PROJECT_VERSION: 1
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: false
  NabcamStorageHost:
    type: application
    platform: iOS
    sources:
      - path: NabcamStorageHost
        excludes: [Simulator.entitlements]
      - path: NabcamIOS/ConnectionProfiles.swift
    dependencies:
      - package: NabcamCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnabcamirl.storage-host
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGN_ENTITLEMENTS: NabcamStorageHost/Simulator.entitlements
        SUPPORTED_PLATFORMS: iphonesimulator
  NabcamStorageTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NabcamIOSTests
    dependencies:
      - package: NabcamCore
      - target: NabcamStorageHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.gnabcamirl.storage-tests
        GENERATE_INFOPLIST_FILE: true
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/NabcamStorageHost.app/NabcamStorageHost
        BUNDLE_LOADER: $(TEST_HOST)
schemes:
  NabcamStorageTests:
    build:
      targets:
        NabcamStorageTests: [test]
    test:
      targets:
        - NabcamStorageTests
  NabcamIOS:
    build:
      targets:
        NabcamIOS: all
